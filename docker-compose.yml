services:
  bootstrap-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_SERVICE: cmd/server
    container_name: bootstrap-server
    hostname: bootstrap-server
    networks:
      - coursework-net
    ports:
      - "9000:9000"
    volumes:
      - ./bootstrap.txt:/app/bootstrap.txt:write
    environment:
      - BOOTSTRAP_HOST=bootstrap-server

  initiator:
    build:
      context: .
      dockerfile: Dockerfile_user
      args:
        BUILD_SERVICE: cmd/p2p_node
    container_name: initiator
    depends_on:
      - bootstrap-server
    networks:
      - coursework-net
    volumes:
      - ./processed_images:/app/processed_images
      - ./style_image:/app/style_image:ro
      - ./test_images:/app/test_images:ro
      - ./bootstrap.txt:/app/bootstrap.txt:ro
      - ./weights:/app/weights:ro
    environment:
      - MODE=initiator
      - VGG_WEIGHTS=/app/weights/vgg19-dcbb9e9d.pth
    # Оверрайдим entrypoint так, чтобы сразу подставить два ответа через stdin:
    # "printf '%s\n%s\n' '/app/style_image/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg' '/app/test_images' | /usr/local/bin/app initiator"
    entrypoint: ["/bin/sh", "-c", 
      "printf '%s\n%s\n' '/app/style_image/44fe27acdc9959bbf83bcda0960cc4dd.jpg' '/app/test_images' | /usr/local/bin/app initiator"
    ]
  processor1:
    build:
      context: .
      dockerfile: Dockerfile_user
      args:
        BUILD_SERVICE: cmd/p2p_node
    container_name: processor1
    depends_on:
      - bootstrap-server
    networks:
      - coursework-net
    volumes:
      - ./bootstrap.txt:/app/bootstrap.txt:ro
      - ./weights:/app/weights:ro
    environment:
      - EPOCHS=300
      - MODE=processor
      - VGG_WEIGHTS=/app/weights/vgg19-dcbb9e9d.pth
    command: ["processor"]

  processor2:
    build:
      context: .
      dockerfile: Dockerfile_user
      args:
        BUILD_SERVICE: cmd/p2p_node
    container_name: processor2
    depends_on:
      - bootstrap-server
    networks:
      - coursework-net
    volumes:
      - ./bootstrap.txt:/app/bootstrap.txt:ro
      - ./weights:/app/weights:ro
    environment:
      - EPOCHS=300
      - MODE=processor
      - VGG_WEIGHTS=/app/weights/vgg19-dcbb9e9d.pth
    command: ["processor"]

  processor3:
    build:
      context: .
      dockerfile: Dockerfile_user
      args:
        BUILD_SERVICE: cmd/p2p_node
    container_name: processor3
    depends_on:
      - bootstrap-server
    networks:
      - coursework-net
    volumes:
      - ./bootstrap.txt:/app/bootstrap.txt:ro
      - ./weights:/app/weights:ro
    environment:
      - EPOCHS=300
      - MODE=processor
      - VGG_WEIGHTS=/app/weights/vgg19-dcbb9e9d.pth
    command: ["processor"]

networks:
  coursework-net:
    driver: bridge
